<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJA Chat Bot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FFF0F5; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
#app { display: flex; flex-direction: column; height: 100vh; max-height: 720px; width: 100%; max-width: 420px; border-radius: 24px; overflow: hidden; border: 1.5px solid #F4C0D1; background: #FFFBFE; box-shadow: 0 8px 32px rgba(212,83,126,0.15); }
#header { padding: 14px 18px; background: #FBEAF0; border-bottom: 1px solid #F4C0D1; display: flex; align-items: center; gap: 12px; }
#avatar { width: 42px; height: 42px; border-radius: 50%; background: #F4C0D1; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
#hinfo { flex: 1; }
#hname { font-size: 15px; font-weight: 600; color: #72243E; }
#hstatus { font-size: 12px; color: #993556; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
#sdot { width: 6px; height: 6px; border-radius: 50%; background: #5DCAA5; }
#apibtn { font-size: 12px; color: #993556; cursor: pointer; padding: 5px 10px; border: 1px solid #F4C0D1; border-radius: 20px; background: #FFFBFE; }
#apibtn:hover { background: #F4C0D1; }
#voice-bar { padding: 8px 14px; background: #FFF0F5; border-bottom: 1px solid #F4C0D1; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#voice-bar::-webkit-scrollbar { display: none; }
.vbtn { font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid #F4C0D1; background: #FFFBFE; color: #72243E; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
.vbtn:hover { background: #F4C0D1; }
.vbtn.active { background: #D4537E; color: white; border-color: #D4537E; }
#token-bar { padding: 5px 14px; background: #FFF8FB; border-bottom: 1px solid #F4C0D1; display: flex; align-items: center; justify-content: space-between; }
#token-info { font-size: 11px; color: #993556; }
#model-badge { font-size: 10px; padding: 2px 8px; background: #F4C0D1; color: #72243E; border-radius: 10px; font-weight: 600; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FFFBFE; }
.msg { display: flex; gap: 8px; max-width: 88%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 10px 14px; font-size: 14px; line-height: 1.55; }
.msg.user .bubble { background: #ED93B1; color: #4B1528; border-radius: 18px 18px 4px 18px; }
.msg.bot .bubble { background: #F4C0D1; color: #72243E; border-radius: 18px 18px 18px 4px; }
.mtime { font-size: 11px; color: #D4537E; margin-top: 3px; }
.msg.user .mtime { text-align: right; }
.typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #D4537E; animation: bop 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bop { 0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-5px);opacity:1} }
#iarea { padding: 10px 16px 14px; border-top: 1px solid #F4C0D1; background: #FBEAF0; }
#apisetup { padding: 10px 12px; margin-bottom: 10px; background: #FAEEDA; border-radius: 12px; font-size: 13px; color: #633806; display: none; }
#apisetup.show { display: block; }
#aprow { display: flex; gap: 8px; margin-top: 8px; }
#apiinput { flex: 1; font-size: 13px; padding: 6px 10px; border: 1px solid #FAC775; border-radius: 12px; background: #FFFBFE; color: #412402; outline: none; }
#savebtn { font-size: 13px; padding: 6px 14px; background: #FAC775; border: none; border-radius: 12px; color: #412402; cursor: pointer; font-weight: 500; }
#savebtn:hover { background: #EF9F27; }
#automicrow { margin-bottom: 8px; }
#automicbtn { font-size: 12px; padding: 6px 16px; border-radius: 20px; border: 1.5px solid #F4C0D1; background: #FFFBFE; color: #993556; cursor: pointer; transition: all 0.2s; width: 100%; }
#automicbtn.on { background: #D4537E; color: white; border-color: #D4537E; }
#irow { display: flex; gap: 8px; align-items: flex-end; }
#tinput { flex: 1; font-size: 14px; padding: 10px 14px; border: 1.5px solid #F4C0D1; border-radius: 20px; background: #FFFBFE; color: #4B1528; resize: none; max-height: 100px; outline: none; line-height: 1.5; }
#tinput::placeholder { color: #D4537E; opacity: 0.7; }
#tinput:focus { border-color: #D4537E; }
#micbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid #F4C0D1; background: #FFFBFE; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: all 0.2s; }
#micbtn.on { background: #FCEBEB; border-color: #E24B4A; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }
#sndbtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #D4537E; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px; flex-shrink: 0; }
#sndbtn:hover { background: #993556; }
#micst { font-size: 12px; color: #E24B4A; text-align: center; margin-top: 6px; display: none; }
#micst.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="avatar">🌸</div>
    <div id="hinfo">
      <div id="hname">AJA Chat Bot</div>
      <div id="hstatus"><span id="sdot"></span><span>พร้อมคุยแล้ว</span></div>
    </div>
    <button id="apibtn" onclick="toggleApi()">🔑 API Key</button>
  </div>

  <div id="voice-bar">
    <span style="font-size:11px;color:#993556;white-space:nowrap;font-weight:500;">🔊</span>
    <button class="vbtn active" onclick="setVoice('default',this)">👩 ปกติ</button>
    <button class="vbtn" onclick="setVoice('male',this)">👨 ชาย</button>
    <button class="vbtn" onclick="setVoice('female',this)">👩‍🦰 หญิง</button>
    <button class="vbtn" onclick="setVoice('old',this)">👴 เฒ่า</button>
    <button class="vbtn" onclick="setVoice('young',this)">🧒 หนุ่ม</button>
    <button class="vbtn" onclick="setVoice('robot',this)">🤖 หุ่นยนต์</button>
    <button class="vbtn" onclick="setVoice('cartoon',this)">🐣 การ์ตูน</button>
  </div>

  <div id="token-bar">
    <span id="token-info">💬 ประวัติ: <span id="hist-count">0</span>/20 ข้อความ</span>
    <span id="model-badge">✨ Haiku 4.5 (ประหยัด)</span>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div>
        <div class="bubble">สวัสดีค้าา! หนูชื่อ AJA นะ 🌸 กดปุ่ม <b>🔁 โหมดวนซ้ำ</b> แล้วพูดครั้งแรก หลังจากนั้นไมค์จะเปิดเองอัตโนมัติเลย!</div>
        <div class="mtime">เพิ่งเริ่ม</div>
      </div>
    </div>
  </div>

  <div id="iarea">
    <div id="apisetup">
      <strong>ใส่ Claude API Key ก่อนนะคะ 🔑</strong><br>
      สมัครได้ที่ <a href="https://console.anthropic.com" target="_blank" style="color:#633806;">console.anthropic.com</a>
      <div id="aprow">
        <input id="apiinput" type="password" placeholder="sk-ant-..." />
        <button id="savebtn" onclick="saveKey()">บันทึก</button>
      </div>
    </div>
    <div id="automicrow">
      <button id="automicbtn" onclick="toggleAutoMic()">🔁 โหมดวนซ้ำ: ปิด — กดเพื่อพูดต่อเนื่องอัตโนมัติ</button>
    </div>
    <div id="irow">
      <textarea id="tinput" rows="1" placeholder="พิมพ์ตรงนี้เลยนะ..." onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button id="micbtn" onclick="toggleMic()">🎙️</button>
      <button id="sndbtn" onclick="send()">➤</button>
    </div>
    <div id="micst">🔴 กำลังฟังอยู่นะ พูดได้เลย...</div>
  </div>
</div>

<script>
let key = '', hist = [], rec = null, listening = false;
let voiceMode = 'default', allVoices = [];
let autoMic = false;

const SYSTEM = 'คุณชื่อ AJA เพื่อนสนิทน่ารัก ตอบภาษาไทยสั้นๆ ไม่เกิน 2-3 ประโยค เป็นกันเอง';
const MAX_HIST = 20;

// โหลด API Key จาก localStorage อัตโนมัติ
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('aja_api_key');
  if (saved) {
    key = saved;
    setTimeout(() => addMsg('bot', 'ยินดีต้อนรับกลับมานะ! พร้อมคุยแล้วเลย 🌸'), 100);
  }
});

if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = () => { allVoices = speechSynthesis.getVoices(); };
  setTimeout(() => { allVoices = speechSynthesis.getVoices(); }, 500);
}

function toggleAutoMic() {
  autoMic = !autoMic;
  const btn = document.getElementById('automicbtn');
  if (autoMic) {
    btn.textContent = '🔁 โหมดวนซ้ำ: เปิด — กำลังฟังอัตโนมัติ';
    btn.classList.add('on');
    if (!listening) startMic();
  } else {
    btn.textContent = '🔁 โหมดวนซ้ำ: ปิด — กดเพื่อพูดต่อเนื่องอัตโนมัติ';
    btn.classList.remove('on');
    stopMic();
  }
}

function setVoice(m, btn) {
  voiceMode = m;
  document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleApi() { document.getElementById('apisetup').classList.toggle('show'); }

function saveKey() {
  const v = document.getElementById('apiinput').value.trim();
  if (v.startsWith('sk-')) {
    key = v; localStorage.setItem('aja_api_key', v);
    document.getElementById('apisetup').classList.remove('show');
    addMsg('bot', 'ตั้งค่าเรียบร้อยแล้ว คุยได้เลยนะ! 🎉');
  } else { alert('API Key ต้องขึ้นต้นด้วย sk-ant-...'); }
}

function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function now() { return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }
function updateCount() { document.getElementById('hist-count').textContent = hist.length; }
function trimHistory() {
  if (hist.length > MAX_HIST) hist = hist.slice(hist.length - MAX_HIST);
  updateCount();
}

function addMsg(role, text) {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<div><div class="bubble">${text.replace(/\n/g,'<br>')}</div><div class="mtime">${now()}</div></div>`;
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
}

function showTyping() {
  const m = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg bot'; d.id = 'typ';
  d.innerHTML = `<div><div class="bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  m.appendChild(d); m.scrollTop = m.scrollHeight;
}
function hideTyping() { const e = document.getElementById('typ'); if (e) e.remove(); }

async function send(txt) {
  const inp = document.getElementById('tinput');
  const msg = txt || inp.value.trim();
  if (!msg) return;
  if (!key) { document.getElementById('apisetup').classList.add('show'); return; }
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', msg);
  hist.push({ role: 'user', content: msg });
  trimHistory();
  showTyping();
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 500,
        system: SYSTEM,
        messages: hist
      })
    });
    const d = await r.json();
    hideTyping();
    if (d.content && d.content[0]) {
      const rep = d.content[0].text;
      hist.push({ role: 'assistant', content: rep });
      trimHistory();
      addMsg('bot', rep);
      speak(rep);
    } else {
      addMsg('bot', 'อุ๊ย เกิดข้อผิดพลาด ลองใหม่นะ 🙏');
      if (autoMic) setTimeout(() => startMic(), 500);
    }
  } catch(e) {
    hideTyping();
    addMsg('bot', 'เชื่อมต่อไม่ได้ เช็ค API Key หรือเน็ตก่อนนะ');
    if (autoMic) setTimeout(() => startMic(), 500);
  }
}

function speak(text) {
  if (!window.speechSynthesis) {
    if (autoMic) setTimeout(() => startMic(), 300);
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const thV = allVoices.filter(v => v.lang.startsWith('th'));
  switch(voiceMode) {
    case 'default': u.lang='th-TH'; u.pitch=1; u.rate=1; if(thV[0]) u.voice=thV[0]; break;
    case 'male': u.lang='th-TH'; u.pitch=0.6; u.rate=0.95; if(thV[0]) u.voice=thV[0]; break;
    case 'female': u.lang='th-TH'; u.pitch=1.3; u.rate=1.05; if(thV[0]) u.voice=thV[0]; break;
    case 'old': u.lang='th-TH'; u.pitch=0.5; u.rate=0.75; if(thV[0]) u.voice=thV[0]; break;
    case 'young': u.lang='th-TH'; u.pitch=1.5; u.rate=1.2; if(thV[0]) u.voice=thV[0]; break;
    case 'robot': u.pitch=0.1; u.rate=0.85;
      const enV = allVoices.find(v => v.lang==='en-US');
      if(enV){u.voice=enV;u.lang='en-US';}else if(thV[0]){u.voice=thV[0];u.lang='th-TH';}
      break;
    case 'cartoon': u.lang='th-TH'; u.pitch=2.0; u.rate=1.3; if(thV[0]) u.voice=thV[0]; break;
  }
  // หลัง AJA พูดเสร็จ → เปิดไมค์อัตโนมัติถ้าโหมดวนซ้ำเปิดอยู่
  u.onend = () => { if (autoMic) setTimeout(() => startMic(), 300); };
  u.onerror = () => { if (autoMic) setTimeout(() => startMic(), 300); };
  speechSynthesis.speak(u);
}

function toggleMic() { listening ? stopMic() : startMic(); }

function startMic() {
  if (listening) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('ใช้ Chrome นะคะ จะได้รองรับการพูดได้'); return; }
  try {
    rec = new SR();
    rec.lang = 'th-TH';
    rec.interimResults = false;
    rec.onresult = e => {
      const txt = e.results[0][0].transcript;
      stopMic();
      send(txt);
    };
    rec.onerror = () => { stopMicUI(); };
    rec.onend = () => {
      // ถ้าไม่มีผลลัพธ์และ autoMic เปิดอยู่ → เปิดใหม่
      if (autoMic) {
        listening = false;
        setTimeout(() => startMic(), 300);
      } else {
        stopMicUI();
      }
    };
    rec.start();
    listening = true;
    document.getElementById('micbtn').classList.add('on');
    document.getElementById('micst').classList.add('show');
  } catch(e) { listening = false; }
}

function stopMicUI() {
  listening = false;
  document.getElementById('micbtn').classList.remove('on');
  document.getElementById('micst').classList.remove('show');
}

function stopMic() {
  if (rec) { try { rec.stop(); } catch(e){} }
  stopMicUI();
}
</script>
</body>
</html>
